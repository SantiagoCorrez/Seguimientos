            <!-- Right Side: Login Form -->
            <div class="w-full md:w-1/2 flex justify-center md:justify-end">
                <div class="bg-white p-8 md:p-10 rounded-[2rem] shadow-xl w-full" id="login">
                    <h2 class="text-3xl font-bold mb-8 text-center text-gray-800">Inicia sesión</h2>

                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

                        <!-- Email Field -->
                        <div class="relative">
                            <label for="email" class="font-bold text-gray-700 block mb-1">Email<span
                                    class="text-red-500">*</span></label>
                            <input id="email" type="text" formControlName="email" placeholder="tucorreo@ejemplo.com"
                                class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors text-gray-600"
                                [ngClass]="{'border-red-500': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}" />

                            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                                class="text-red-500 text-xs mt-1 ml-2">
                                <span *ngIf="loginForm.get('email')?.errors?.['required']">El correo es
                                    requerido.</span>
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="relative">
                            <label for="password" class="font-bold text-gray-700 block mb-1">Contraseña<span
                                    class="text-red-500">*</span></label>
                            <div class="relative">
                                <input [type]="showPassword ? 'text' : 'password'" id="password"
                                    formControlName="password" placeholder="tu contraseña"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors text-gray-600 placeholder-gray-400"
                                    [ngClass]="{'border-red-500': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}" />

                                <button type="button"
                                    class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none"
                                    (click)="togglePasswordVisibility()">
                                    <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </button>
                            </div>

                            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                                class="text-red-500 text-xs mt-1 ml-2">
                                <span *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es
                                    requerida.</span>
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div *ngIf="errorMessage"
                            class="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 text-sm rounded">
                            {{ errorMessage }}
                        </div>
                        <br>
                        <!-- Submit Button -->
                        <button type="submit" [disabled]="loginForm.invalid"
                            class="w-full bg-[#002845] text-white font-bold py-3 rounded-full hover:bg-[#003355] transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md text-lg">
                            Iniciar sesión
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Background decoration could go here or in CSS -->
    </main>

    <!-- Footer -->
    <app-footer></app-footer>
</div>
